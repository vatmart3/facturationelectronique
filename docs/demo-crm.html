<title>Pastille CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Onest:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : application plein écran, barre latérale par catégories à gauche, vue courante à droite */
:root{
  --fond:#F4F4F1; --surface:#FFFFFF; --surface-2:#FAFAF8; --survol:#F1F1ED;
  --encre:#16171B; --encre-2:#585A61; --encre-3:#8B8D94;
  --trait:#E6E5E0; --trait-fort:#D3D2CC;
  --accent:#1F3A5F; --accent-doux:#E9EEF5;
  --marque:#FF5A36;
  --ok:#23774F; --ok-doux:#E5F1EA;
  --info:#2F5E9E; --info-doux:#E7EEF8;
  --attente:#86650F; --attente-doux:#F5EED8;
  --alerte:#B23C12; --alerte-doux:#F8E6DE;
  --avoir:#5E3FA3; --avoir-doux:#EEE9F7;
  --neutre:#5D5F66; --neutre-doux:#EEEEEA;
  --ombre:0 1px 2px rgb(16 17 20 / .05), 0 1px 1px rgb(16 17 20 / .03);
  --ombre-haute:0 12px 32px -12px rgb(16 17 20 / .18), 0 2px 6px rgb(16 17 20 / .05);
  --anneau:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  --r-s:6px; --r-m:8px; --r-l:12px; --r-xl:16px;
  --f-titre:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-texte:"Onest","Segoe UI",system-ui,sans-serif;
  --f-chiffre:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#0F1012; --surface:#17181B; --surface-2:#131417; --survol:#1E1F23;
    --encre:#EDEDEA; --encre-2:#A3A5AC; --encre-3:#75777E;
    --trait:#26272C; --trait-fort:#35363C;
    --accent:#9DB7DD; --accent-doux:#1A2432;
    --ok:#6CC59A; --ok-doux:#14271E; --info:#8DB1E6; --info-doux:#15202E;
    --attente:#E0BE5E; --attente-doux:#29230F; --alerte:#F0875A; --alerte-doux:#2D1A12;
    --avoir:#B9A2EC; --avoir-doux:#221B32; --neutre:#A3A5AC; --neutre-doux:#222327;
    --ombre:0 1px 2px rgb(0 0 0 / .4); --ombre-haute:0 16px 40px -12px rgb(0 0 0 / .6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fond:#0F1012; --surface:#17181B; --surface-2:#131417; --survol:#1E1F23;
  --encre:#EDEDEA; --encre-2:#A3A5AC; --encre-3:#75777E;
  --trait:#26272C; --trait-fort:#35363C;
  --accent:#9DB7DD; --accent-doux:#1A2432;
  --ok:#6CC59A; --ok-doux:#14271E; --info:#8DB1E6; --info-doux:#15202E;
  --attente:#E0BE5E; --attente-doux:#29230F; --alerte:#F0875A; --alerte-doux:#2D1A12;
  --avoir:#B9A2EC; --avoir-doux:#221B32; --neutre:#A3A5AC; --neutre-doux:#222327;
  --ombre:0 1px 2px rgb(0 0 0 / .4); --ombre-haute:0 16px 40px -12px rgb(0 0 0 / .6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--surface);color:var(--encre);font-family:var(--f-texte);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-titre);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font-family:inherit}
code{font-family:var(--f-chiffre);font-size:.9em}
:focus-visible{outline:none;box-shadow:var(--anneau);border-radius:var(--r-s)}
.num{font-family:var(--f-chiffre);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
html,body{height:100%}
.feuille{height:100%}
.surtitre{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-3)}
.chapeau{color:var(--encre-2);max-width:68ch;font-size:15px}

/* En-tête de page */
.entete{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end}
.entete-txt{display:flex;flex-direction:column;gap:10px}
.entete h1{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.08}
.bascule{display:inline-flex;padding:3px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--trait)}
.bascule button{font-size:13px;font-weight:500;color:var(--encre-2);background:none;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.bascule button[aria-pressed="true"]{background:var(--encre);color:var(--surface)}

/* ===== Application ===== */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100%;background:var(--surface);overflow:hidden}
.side{background:var(--surface-2);border-right:1px solid var(--trait);display:flex;flex-direction:column;gap:14px;padding:14px 10px;overflow-y:auto}
.org{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-m);border:1px solid var(--trait);background:var(--surface);cursor:pointer;text-align:left;width:100%;color:inherit}
.org-logo{width:30px;height:30px;border-radius:7px;background:var(--encre);color:var(--surface);display:grid;place-items:center;font:700 12px var(--f-titre);flex:none}
.org-txt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.org-txt b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-txt span{font-size:12px;color:var(--encre-3)}
.org svg{width:14px;height:14px;color:var(--encre-3);flex:none}
.recherche-side{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--r-m);border:1px solid var(--trait);background:var(--surface);color:var(--encre-3);font-size:13px;cursor:pointer;width:100%}
.recherche-side svg{width:15px;height:15px}
.recherche-side kbd{margin-left:auto}
kbd{font:500 11px var(--f-chiffre);padding:1px 6px;border-radius:5px;border:1px solid var(--trait);background:var(--surface-2);color:var(--encre-2)}
.groupe{display:flex;flex-direction:column;gap:1px}
.groupe-titre{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);padding:6px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-m);border:0;background:none;color:var(--encre-2);font-size:13.5px;font-weight:500;cursor:pointer;width:100%;text-align:left;white-space:nowrap}
.nav svg{width:16px;height:16px;flex:none;color:var(--encre-3)}
.nav:hover{background:var(--survol);color:var(--encre)}
.nav[aria-current="page"]{background:var(--surface);color:var(--encre);font-weight:600;box-shadow:var(--ombre);outline:1px solid var(--trait)}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav .compte{margin-left:auto;font:500 11.5px var(--f-chiffre);color:var(--encre-3)}
.nav .compte.alerte{color:var(--alerte);background:var(--alerte-doux);padding:1px 6px;border-radius:5px}
.side-bas{margin-top:auto;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--trait);padding-top:10px}
.marque{display:flex;align-items:center;gap:7px;padding:8px 10px 0;font:700 14px var(--f-titre);letter-spacing:-.02em;color:var(--encre-2)}
.marque i{width:9px;height:9px;border-radius:50%;background:var(--marque);display:inline-block}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.barre{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-bottom:1px solid var(--trait);flex:none}
.fil{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--encre-3);min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.fil b{color:var(--encre);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.fil .sep{color:var(--trait-fort)}
.contenu{flex:1;overflow-y:auto;padding:24px 28px 40px;display:flex;flex-direction:column;gap:22px;min-height:0}
.contenu > *{flex-shrink:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-m);font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--trait-fort);background:var(--surface);color:var(--encre);white-space:nowrap;box-shadow:var(--ombre);transition:background .15s,border-color .15s}
.btn:hover{background:var(--survol)}
.btn svg{width:15px;height:15px}
.btn.primaire{background:var(--encre);color:var(--surface);border-color:var(--encre)}
.btn.primaire:hover{background:var(--encre-2);border-color:var(--encre-2)}
.btn.fantome{background:none;border-color:transparent;box-shadow:none;color:var(--encre-2)}
.btn.fantome:hover{background:var(--survol);color:var(--encre)}
.btn.s{height:28px;padding:0 10px;font-size:12.5px}

/* En-tête de vue */
.vue-tete{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.vue-tete h2{font-size:24px;font-weight:700;line-height:1.15}
.vue-tete p{color:var(--encre-2);font-size:13.5px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Segments + outils */
.outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.segments{display:flex;gap:2px;border-bottom:1px solid var(--trait);overflow-x:auto;max-width:100%}
.segment{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:0;background:none;color:var(--encre-2);font-size:13.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.segment:hover{color:var(--encre)}
.segment[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--encre);font-weight:600}
.segment .num{font-size:11.5px;color:var(--encre-3)}
.champ{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--trait-fort);border-radius:var(--r-m);background:var(--surface);min-width:0}
.champ:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
.champ svg{width:15px;height:15px;color:var(--encre-3);flex:none}
.champ input{border:0;outline:none;background:none;font:inherit;font-size:13.5px;color:var(--encre);min-width:0;width:200px}

/* Tableaux */
.tableau{border:1px solid var(--trait);border-radius:var(--r-l);overflow-x:auto;background:var(--surface)}
.tableau table{width:100%;border-collapse:collapse;min-width:760px}
.tableau th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--encre-3);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--trait);white-space:nowrap}
.tableau td{padding:11px 14px;border-bottom:1px solid var(--trait);vertical-align:middle}
.tableau tr:last-child td{border-bottom:0}
.tableau tbody tr.cliquable{cursor:pointer}
.tableau tbody tr.cliquable:hover td{background:var(--survol)}
.tableau .d{text-align:right}
.cel-client{display:flex;align-items:center;gap:10px;min-width:0}
.cel-client div{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.cel-client b{font-weight:600;white-space:nowrap}
.cel-client span{font-size:12px;color:var(--encre-3)}
.muet{color:var(--encre-3)}
.pied-tableau{display:flex;justify-content:space-between;font-size:12.5px;color:var(--encre-3);padding:2px 4px}

/* Puces */
.statut{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-s);font-size:12.5px;font-weight:500;background:var(--x-doux);color:var(--x);white-space:nowrap}
.statut::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-brouillon{--x:var(--attente);--x-doux:var(--attente-doux)}
.st-envoyee{--x:var(--info);--x-doux:var(--info-doux)}
.st-retard{--x:var(--alerte);--x-doux:var(--alerte-doux)}
.st-payee{--x:var(--ok);--x-doux:var(--ok-doux)}
.st-avoir{--x:var(--avoir);--x-doux:var(--avoir-doux)}
.st-neutre{--x:var(--neutre);--x-doux:var(--neutre-doux)}
.categorie{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-s);border:1px solid var(--trait);font-size:12px;color:var(--encre-2);white-space:nowrap;background:var(--surface)}
.categorie i{width:7px;height:7px;border-radius:2px;background:var(--c);display:inline-block}
.pa{font-size:12.5px;color:var(--encre-2);white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font:600 12px var(--f-titre);background:var(--a-doux);color:var(--a)}
.avatar.l{width:56px;height:56px;font-size:19px}

/* Indicateurs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--trait);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--trait);min-width:0}
.kpi:last-child{border-right:0}
.kpi .lib{font-size:12.5px;color:var(--encre-2);display:flex;align-items:center;gap:6px}
.kpi .lib i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--encre-3))}
.kpi .val{font:600 22px var(--f-titre);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .sous{font-size:12px;color:var(--encre-3)}
.grille-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.panneau{border:1px solid var(--trait);border-radius:var(--r-l);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.panneau-tete{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--trait)}
.panneau-tete h3{font-size:14.5px;font-weight:600}
.panneau-corps{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.barres{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px;border-bottom:1px solid var(--trait)}
.barre-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.barre-col span.b{width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--trait-fort)}
.barre-col.courant span.b{background:var(--accent)}
.barre-col em{font-style:normal;font:500 10.5px var(--f-chiffre);color:var(--encre-3)}
.mois{display:flex;gap:10px}
.mois span{flex:1;text-align:center;font-size:11.5px;color:var(--encre-3)}
.taches{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.taches li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--trait)}
.taches li:last-child{border-bottom:0}
.taches .pt{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.taches .t{flex:1;min-width:0;display:flex;flex-direction:column}
.taches .t b{font-weight:500}
.taches .t span{font-size:12.5px;color:var(--encre-3)}
.lignes-cle{display:flex;flex-direction:column}
.lignes-cle div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--trait);font-size:13.5px}
.lignes-cle div:last-child{border-bottom:0}
.lignes-cle dt,.lignes-cle .k{color:var(--encre-2)}
.lignes-cle .v{text-align:right;font-weight:500}

/* Fiche client */
.fiche-tete{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.fiche-id{display:flex;gap:16px;align-items:center;min-width:0}
.fiche-id h2{font-size:24px;font-weight:700}
.fiche-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:6px;font-size:13px;color:var(--encre-2)}
.retour{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--encre-2);background:none;border:0;cursor:pointer;padding:0;width:max-content}
.retour:hover{color:var(--encre)}
.retour svg{width:14px;height:14px}
.chronologie{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chronologie li{display:grid;grid-template-columns:62px 14px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.chronologie .date{font-size:12px;color:var(--encre-3);text-align:right;padding-top:1px}
.chronologie .rond{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--trait-fort));margin-top:5px;position:relative;z-index:1}
.chronologie li:not(:last-child)::after{content:"";position:absolute;left:78px;top:16px;bottom:0;width:1px;background:var(--trait)}
.chronologie .t span{display:block;font-size:12.5px;color:var(--encre-3)}
.contact{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--trait)}
.contact:last-child{border-bottom:0}
.contact div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.contact span{font-size:12.5px;color:var(--encre-3)}
.regle{font-size:12.5px;color:var(--encre-2);background:var(--surface-2);border:1px dashed var(--trait-fort);border-radius:var(--r-m);padding:10px 12px}

.vide{border:1px dashed var(--trait-fort);border-radius:var(--r-l);padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--encre-2)}
.vide h3{font-size:17px;color:var(--encre)}
.vide p{max-width:52ch}

/* ===== Système ===== */
.section{display:flex;flex-direction:column;gap:20px}
.section h2{font-size:26px;font-weight:700}
.sys-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sys-carte{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sys-carte h3{font-size:15px;font-weight:600}
.pastilles-couleur{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.couleur{display:flex;flex-direction:column;gap:6px;font-size:12px}
.couleur span.e{height:44px;border-radius:var(--r-m);border:1px solid var(--trait)}
.couleur b{font-family:var(--f-chiffre);font-weight:500;font-size:11.5px}
.couleur em{font-style:normal;color:var(--encre-3);font-size:11.5px}
.rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.echelle div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--trait)}
.echelle div:last-child{border-bottom:0}
.echelle code{color:var(--encre-3);font-size:11.5px}
.arbre{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-l);padding:20px 22px;overflow-x:auto}
.arbre pre{margin:0;font:400 12.5px/1.75 var(--f-chiffre);color:var(--encre)}
.arbre .c{color:var(--encre-3)}
.arbre .p1{color:var(--accent);font-weight:500}
.decisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.decision{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-l);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.decision h3{font-size:15px;font-weight:600}
.decision p{color:var(--encre-2);font-size:13.5px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--encre);color:var(--surface);padding:10px 16px;border-radius:var(--r-m);font-size:13.5px;z-index:90;box-shadow:var(--ombre-haute);max-width:calc(100% - 32px)}

/* Palette de commande */
.voile{position:fixed;inset:0;background:rgb(10 10 12 / .35);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 16px}
.palette{width:min(100%,560px);background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-xl);box-shadow:var(--ombre-haute);overflow:hidden}
.palette-champ{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--trait)}
.palette-champ svg{width:17px;height:17px;color:var(--encre-3)}
.palette-champ input{flex:1;border:0;outline:none;background:none;font:inherit;font-size:15px;color:var(--encre);min-width:0}
.palette ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-m);cursor:pointer;font-size:13.5px}
.palette li[aria-selected="true"]{background:var(--survol)}
.palette li .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.palette li .type{font-size:12px;color:var(--encre-3)}
.palette li.vide-p{color:var(--encre-3);cursor:default}


.demo-puce{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--attente);background:var(--attente-doux);padding:3px 8px;border-radius:var(--r-s);white-space:nowrap}
.side .bascule{display:flex;margin:6px 4px 0;box-shadow:none}
.side .bascule button{flex:1;padding:5px 6px;font-size:12px}
.fenetre{width:min(100%,520px);background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-xl);box-shadow:var(--ombre-haute);display:flex;flex-direction:column;max-height:calc(100dvh - 32px);overflow:auto}
.fenetre-tete{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--trait)}
.fenetre-tete h2{font-size:17px;font-weight:700}
.fenetre-corps{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fenetre-corps .large{grid-column:1/-1}
.fenetre-pied{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--trait);background:var(--surface-2)}
.f-champ{display:flex;flex-direction:column;gap:6px;min-width:0}
.f-champ label{font-size:13px;font-weight:500}
.f-champ input,.f-champ select{height:38px;border:1px solid var(--trait-fort);border-radius:var(--r-m);background:var(--surface);color:var(--encre);font:inherit;font-size:14px;padding:0 10px;min-width:0;width:100%}
.f-champ input:focus,.f-champ select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-doux)}
.f-champ input.num{font-family:var(--f-chiffre)}
.f-champ .aide{font-size:12px;color:var(--encre-3)}
.f-champ.erreur input{border-color:var(--alerte)}
.f-champ.erreur .aide{color:var(--alerte)}
.icone-btn{width:30px;height:30px;border-radius:var(--r-m);border:0;background:none;color:var(--encre-2);cursor:pointer;display:grid;place-items:center}
.icone-btn:hover{background:var(--survol);color:var(--encre)}
@media (max-width:560px){.fenetre-corps{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--trait)}
  .grille-2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .side{flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--trait);padding:10px}
  .side .bascule,.demo-puce{display:none}
  .side .groupe{flex-direction:row}
  .groupe-titre,.recherche-side,.marque,.side-bas,.nav .compte{display:none}
  .org{width:auto;flex:none}
  .org-txt span{display:none}
  .main{min-height:auto}
  .contenu{overflow:visible;padding:18px 16px 28px}
  .barre{padding:0 16px}
  .champ input{width:130px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

    recues:'Factures fournisseurs reçues via la plateforme agréée, à approuver, refuser ou marquer payées.',
    ereporting:'Données de transactions et de paiements hors e-invoicing transmises via la plateforme, avec leur statut.',
    reforme:'Où en est l’entreprise : réception, émission, e-reporting, annuaire, et les dates limites qui la concernent.',
    exports:'Écritures de ventes, journal des ventes, état de TVA et archive ZIP des factures d’une période.',
    reglages:'Identité légale, régime de TVA, IBAN, numérotation, membres et rôles, connexion à la plateforme agréée.',
    aide:'Centre d’aide et tutoriels courts.'
  };
  function vueVide(id){
    if(id==='reglages') return '<div class="vue-tete"><div><h2>Réglages</h2><p>Compte</p></div></div><div class="vide"><h3>Démo</h3><p>Les clients que vous créez sont gardés dans ce navigateur uniquement. '+(ajoutes().length?ajoutes().length+' client(s) ajouté(s).':'Aucun client ajouté pour l\u2019instant.')+'</p><button type="button" class="btn" data-action="reset">Réinitialiser la démo</button></div>';
    return '<div class="vue-tete"><div><h2>'+LIB[id]+'</h2><p>'+GRP[id]+'</p></div></div><div class="vide"><h3>Vue construite en phase '+PHASE[id]+'</h3><p>'+DESC[id]+'</p></div>'; }

  /* ---------- Événements ---------- */
  document.getElementById('app').addEventListener('click', function(e){
    var t = e.target.closest('[data-vue],[data-seg],[data-ff],[data-onglet],[data-client],[data-action]'); if(!t) return;
    if(t.dataset.vue){ etat.vue = t.dataset.vue; etat.client = null; etat.onglet = 'apercu'; rendre(); }
    else if(t.dataset.seg){ etat.seg = t.dataset.seg; rendre(); }
    else if(t.dataset.ff){ etat.ff = t.dataset.ff; rendre(); }
    else if(t.dataset.onglet){ etat.onglet = t.dataset.onglet; rendre(); }
    else if(t.dataset.client){ etat.vue = 'clients'; etat.client = t.dataset.client; etat.onglet = 'apercu'; rendre(); }
    else if(t.dataset.action==='retour'){ etat.client = null; rendre(); }
    else if(t.dataset.action==='nouvelle'){ toast('Exemple : l’éditeur de facture s’ouvrirait ici'); }
    else if(t.dataset.action==='nouveau-client'){ ouvrirClient(); }
    else if(t.dataset.action==='reset'){ for(var i=CLIENTS.length-1;i>=0;i--){ if(CLIENTS[i].nouveau) CLIENTS.splice(i,1); } sauver(); majCompteurClients(); rendre(); toast('Démo réinitialisée'); }
    else if(t.dataset.action==='relancer'){ toast('Exemple : 1 relance envoyée à la Mairie de Vannes'); }
    else toast('Exemple : action disponible dans une phase suivante');
  });
  document.getElementById('app').addEventListener('keydown', function(e){
    var tr = e.target.closest('tr[data-client]'); if(tr && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); tr.click(); }
  });
  contenu.addEventListener('input', function(e){
    if(e.target.id==='q-clients'){ etat.q = e.target.value; var pos = e.target.selectionStart; rendre(); var q = document.getElementById('q-clients'); q.focus(); q.setSelectionRange(pos,pos); }
  });
  document.getElementById('org').addEventListener('click', function(){ toast('Exemple : sélecteur d’entreprise (offre Studio)'); });

  /* ---------- Palette Ctrl K ---------- */
  var voile = document.getElementById('voile'), palIn = document.getElementById('pal-in'), palListe = document.getElementById('pal-liste'), res = [], act = 0, avant = null;
  var SOURCES = CLIENTS.map(function(c){ return {t:c.nom, type:'Client', go:function(){ etat.vue='clients'; etat.client=c.id; etat.onglet='apercu'; rendre(); }}; })
    .concat(FACTURES.filter(function(f){return f.n!=='—';}).map(function(f){ return {t:f.n+' · '+client(f.c).nom+' · '+m(f.ttc), type:'Facture', go:function(){ etat.vue='clients'; etat.client=f.c; etat.onglet='documents'; rendre(); }}; }))
    .concat(NAV.reduce(function(a,g){ return a.concat(g.items.map(function(it){ return {t:it.l, type:'Aller à', go:function(){ etat.vue=it.id; etat.client=null; rendre(); }}; })); },[]))
    .concat([{t:'Relancer les factures en retard', type:'Action', go:function(){ toast('Exemple : 1 relance envoyée'); }},{t:'Nouveau client', type:'Action', go:function(){ ouvrirClient(); }}]);
  function palRendre(){
    var q = norm(palIn.value).split(/\s+/).filter(Boolean);
    res = SOURCES.filter(function(s){ var h = norm(s.type+' '+s.t); return q.every(function(w){ return h.indexOf(w)>=0; }); }).slice(0,9);
    if(act>=res.length) act=0;
    palListe.innerHTML = res.length ? res.map(function(s,i){ return '<li role="option" id="pal-'+i+'" data-i="'+i+'" aria-selected="'+(i===act)+'">'+(s.type==='Client'?avatar(s.t):'')+'<span class="txt">'+s.t+'</span><span class="type">'+s.type+'</span></li>'; }).join('')
      : '<li class="vide-p">Aucun résultat.</li>';
    if(res.length) palIn.setAttribute('aria-activedescendant','pal-'+act); else palIn.removeAttribute('aria-activedescendant');
  }
  function palOuvrir(){ avant = document.activeElement; voile.hidden = false; palIn.value=''; act=0; palRendre(); palIn.focus(); }
  function palFermer(){ voile.hidden = true; if(avant&&avant.focus) avant.focus(); }
  function palLancer(i){ var s = res[i]; if(!s) return; palFermer(); s.go(); }
  document.getElementById('ouvrir-palette').addEventListener('click', palOuvrir);
  palIn.addEventListener('input', function(){ act=0; palRendre(); });
  palIn.addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'&&res.length){ e.preventDefault(); act=(act+1)%res.length; palRendre(); }
    else if(e.key==='ArrowUp'&&res.length){ e.preventDefault(); act=(act-1+res.length)%res.length; palRendre(); }
    else if(e.key==='Enter'){ e.preventDefault(); palLancer(act); }
    else if(e.key==='Escape'){ e.preventDefault(); palFermer(); }
  });
  palListe.addEventListener('click', function(e){ var li = e.target.closest('[data-i]'); if(li) palLancer(+li.dataset.i); });
  voile.addEventListener('mousedown', function(e){ if(e.target===voile) palFermer(); });
  document.addEventListener('keydown', function(e){ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); voile.hidden?palOuvrir():palFermer(); } });

  rendre();
})();
</script>
